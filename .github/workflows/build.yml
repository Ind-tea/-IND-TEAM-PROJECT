
name: Build IND TEAM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build both applications
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug :ind-team-token:assembleDebug

      - name: Save APK files
        uses: actions/upload-artifact@v4
        with:
          name: IND-TEAM-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            ind-team-token/build/outputs/apk/debug/*.apk
          if-no-files-found: error
